[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-ledger"
version = "0.1.0"
description = "The write-only, tamper-evident traceability layer of the Decision OS: hash-chained append-only records (contracts-spec audit_entry) + an out-of-process notary anchoring the chain head."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Ali Pourrahim" }]
# The ledger + notary are pure standard library — zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.0", "pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

# `contracts/` holds data only (audit_entry schema + version), not importable
# code, so the flat layout exposes exactly one Python package. Declare it
# explicitly — otherwise setuptools refuses ("multiple top-level packages").
[tool.setuptools]
packages = ["audit_ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
